const knockPool=Array.from({length:4},()=>new Audio('data:audio/wav;base64,'+SOURCES.knock));const doorPool=Array.from({length:3},()=>new Audio('data:audio/wav;base64,'+SOURCES.door));let knockIndex=0,doorIndex=0;
for(const a of [...knockPool,...doorPool]){a.preload='auto';a.volume=.75}
function playKnock(){if(muted)return;const a=knockPool[knockIndex++%knockPool.length];a.currentTime=0;a.play().catch(()=>{})}
function playDoor(){if(muted)return;const a=doorPool[doorIndex++%doorPool.length];a.currentTime=0;a.play().catch(()=>{})}
function stopSounds(){for(const a of [...knockPool,...doorPool]){a.pause();a.currentTime=0}}
door.addEventListener('click',tap);document.getElementById('demo').addEventListener('click',startDemo);document.getElementById('reset').addEventListener('click',resetScene);document.getElementById('sound').addEventListener('click',()=>{muted=!muted;if(muted)stopSounds();document.getElementById('sound').textContent=muted?'音效 关':'音效 开';document.getElementById('sound').setAttribute('aria-pressed',String(!muted))});
function showControls(){document.body.classList.add('active');clearTimeout(quietTimer);quietTimer=setTimeout(()=>document.body.classList.remove('active'),2200)}addEventListener('pointermove',showControls);addEventListener('keydown',e=>{showControls();if(e.key.toLowerCase()==='r')resetScene();if(e.key.toLowerCase()==='d')startDemo();if(e.key==='Escape'&&demoAt!==null){demoAt=null;document.getElementById('demo').textContent='按视频节奏演示'}});addEventListener('resize',resize);document.addEventListener('visibilitychange',()=>{if(document.hidden)stopSounds()});fillTank();resize();showControls();requestAnimationFrame(frame);
</script></body></html>
